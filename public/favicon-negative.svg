<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <clipPath id="round">
      <circle cx="300" cy="300" r="294"/>
    </clipPath>
  </defs>
  <circle cx="300" cy="300" r="300" fill="#2563eb"/>
  <g clip-path="url(#round)">
    <rect width="600" height="600" fill="#fff"/>
    <!-- Crop diretto dal logo originale InCittà: viene mostrato solo il simbolo,
         senza reinterpretarne forme, colori o proporzioni. -->
    <image
      href="/logo-transparent.png"
      x="-10"
      y="-110"
      width="930"
      height="620"
      preserveAspectRatio="none"
    />
  </g>
  <circle cx="300" cy="300" r="294" fill="none" stroke="#facc15" stroke-width="12"/>
</svg>
