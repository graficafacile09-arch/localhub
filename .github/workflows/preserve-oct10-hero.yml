name: Preserve exact homepage hero for October 10 recovery

on:
  push:
    branches:
      - restore-production-2026-10-10-keep-new-hero

permissions:
  contents: write

jobs:
  preserve-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: restore-production-2026-10-10-keep-new-hero
          fetch-depth: 0

      - name: Recover and verify exact WebP image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://localhub-7wvm1jrp0-localhub-castrovillari.vercel.app/hero-coppia-castrovillari.webp" \
            --output public/hero-coppia-castrovillari.webp
          test "$(wc -c < public/hero-coppia-castrovillari.webp | tr -d ' ')" = "156644"
          echo "b81208aa351d670235febaeb7ad9f153725701662e87dd789885ef88466ad1c4  public/hero-coppia-castrovillari.webp" | sha256sum --check -
          test "$(head -c 4 public/hero-coppia-castrovillari.webp)" = "RIFF"
          test "$(dd if=public/hero-coppia-castrovillari.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"

      - name: Commit recovered image and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/preserve-oct10-hero.yml
          git add public/hero-coppia-castrovillari.webp .github/workflows/preserve-oct10-hero.yml
          git commit -m "restore: preserve exact homepage hero from October 10"
          git push origin HEAD:restore-production-2026-10-10-keep-new-hero
