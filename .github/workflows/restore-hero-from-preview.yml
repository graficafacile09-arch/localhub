name: Preserve the new homepage hero in restored backup

on:
  push:
    branches:
      - restore-backup-2026-10-08-keep-new-hero
    paths:
      - app/page.tsx

permissions:
  contents: write

jobs:
  restore-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restore branch
        uses: actions/checkout@v4

      - name: Download and verify the exact WebP from the saved preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://localhub-o4fp32xrj-localhub-castrovillari.vercel.app/hero-coppia-castrovillari.webp?_vercel_share=x1Ff66IspZkFWsC2qjAW9R4ozSzt9aX8'
          curl --fail --silent --show-error --location --retry 2 --cookie-jar "$RUNNER_TEMP/vercel-cookies.txt" --cookie "$RUNNER_TEMP/vercel-cookies.txt" "$url" --output public/hero-coppia-castrovillari.webp
          test "$(wc -c < public/hero-coppia-castrovillari.webp | tr -d ' ')" = '156644'
          echo 'b81208aa351d670235febaeb7ad9f153725701662e87dd789885ef88466ad1c4  public/hero-coppia-castrovillari.webp' | sha256sum --check -
          file public/hero-coppia-castrovillari.webp

      - name: Commit verified image and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-hero-from-preview.yml
          git add public/hero-coppia-castrovillari.webp
          git commit -m 'chore: preserve exact new homepage hero in restored backup'
          git push origin HEAD:restore-backup-2026-10-08-keep-new-hero
