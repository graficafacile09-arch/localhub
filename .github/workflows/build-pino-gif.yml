name: Build Pino GIF

on:
  push:
    paths:
      - "public/pino-assistente.jpg"
      - ".github/workflows/build-pino-gif.yml"
  create:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'create' && github.ref_type == 'branch' && github.ref_name == 'pino-gif-trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - name: Restore the original Pino artwork from its valid Git revision
        shell: bash
        run: |
          set -euo pipefail
          git show 87b42980c5cf1131f22f08ddc706bfe64c306072:public/pino-assistente.jpg > /tmp/pino-original.jpg
          test -s /tmp/pino-original.jpg
          identify /tmp/pino-original.jpg

      - name: Build animated GIF from the original Pino artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pino-frames
          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0) scale=100 ;;
              1) scale=101 ;;
              2) scale=102 ;;
              3) scale=103 ;;
              4) scale=102 ;;
              5) scale=101 ;;
              6) scale=100 ;;
              7) scale=99 ;;
            esac
            convert /tmp/pino-original.jpg -resize "${scale}%" -gravity center -crop 100%x100%+0+0 +repage /tmp/pino-frames/frame-$i.png
          done
          convert -delay 8 -loop 0 /tmp/pino-frames/frame-*.png -layers OptimizeFrame public/pino-assistente.gif
          identify public/pino-assistente.gif

      - name: Commit GIF to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add public/pino-assistente.gif
          if git diff --cached --quiet; then
            echo "GIF already up to date"
            exit 0
          fi
          git commit -m "chore: build real animated GIF for Pino"
          git push origin HEAD:main
