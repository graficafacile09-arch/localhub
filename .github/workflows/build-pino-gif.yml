name: Build Pino expression GIFs
# Rebuild trigger

on:
  push:
    paths:
      - "public/pino-assistente.jpg"
      - ".github/workflows/build-pino-gif.yml"
  create:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'pino-gif-trigger'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          convert -version
          ffmpeg -version | head -n 1

      - name: Restore the original Pino artwork
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://api.github.com/repos/graficafacile09-arch/localhub/git/blobs/d9dfcedc0597ef64efc52a66e18f332a1fa92f1d"             | python -c 'import sys,json; print(json.load(sys.stdin)["content"], end="")'             | base64 -d > /tmp/pino-original.jpg
          test -s /tmp/pino-original.jpg
          ffmpeg -y -v warning -err_detect ignore_err -i /tmp/pino-original.jpg -frames:v 1 /tmp/pino-source.png
          identify /tmp/pino-source.png

      - name: Build Pino GIFs by transforming only his existing eyes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pino-frames
          mkdir -p /tmp/pino-frames/searching /tmp/pino-frames/happy /tmp/pino-frames/sad

          # Pino's original artwork is 280x342. These two small regions sit on the
          # existing eyes. No new eyes, mouths, eyebrows, emojis or graphics are drawn.
          LEFT_EYE="28x28+101+154"
          RIGHT_EYE="28x28+151+154"

          make_eye() {
            local src="$1"
            local geometry="$2"
            local scale="$3"
            local out="$4"
            convert "$src" -crop "$geometry" +repage -alpha on -fuzz 15% -fill none -draw "matte 0,0 floodfill" \
              -resize "100%x${scale}%" -background none -gravity center -extent 28x28 "$out"
          }

          make_frame() {
            local src="$1"
            local out="$2"
            local scale="$3"
            local tmp="$4"
            mkdir -p "$tmp"
            make_eye "$src" "$LEFT_EYE" "$scale" "$tmp/left.png"
            make_eye "$src" "$RIGHT_EYE" "$scale" "$tmp/right.png"
            convert "$src" \
              "$tmp/left.png" -geometry +101+154 -compose over -composite \
              "$tmp/right.png" -geometry +151+154 -compose over -composite \
              "$out"
          }

          # SEARCHING: natural Pino with a gentle blink using the original eye pixels.
          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) effect="100" ;;
              1|6) effect="80" ;;
              2|5) effect="55" ;;
              3|4) effect="30" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/searching/frame-$i.png" "$effect" /tmp/pino-eye-searching
          done

          # HAPPY: existing eyes gently narrow and lift toward the center.
          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) effect="0" ;;
              1|6) effect="70" ;;
              2|5) effect="52" ;;
              3|4) effect="38" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/happy/frame-$i.png" "$effect" /tmp/pino-eye-happy
          done

          # SAD: existing eyes open slightly and pull outward, without drawing replacements.
          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) effect="0" ;;
              1|6) effect="85" ;;
              2|5) effect="100" ;;
              3|4) effect="115" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/sad/frame-$i.png" "$effect" /tmp/pino-eye-sad
          done

          cp /tmp/pino-frames/happy/frame-4.png public/pino-debug-happy.png
          convert -delay 10 -loop 0 /tmp/pino-frames/searching/frame-*.png public/pino-assistente-searching.gif
          convert -delay 10 -loop 0 /tmp/pino-frames/happy/frame-*.png public/pino-assistente-happy.gif
          convert -delay 10 -loop 0 /tmp/pino-frames/sad/frame-*.png public/pino-assistente-sad.gif

          identify public/pino-assistente-searching.gif
          identify public/pino-assistente-happy.gif
          identify public/pino-assistente-sad.gif

      - name: Commit Pino GIFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add public/pino-assistente-searching.gif public/pino-assistente-happy.gif public/pino-assistente-sad.gif public/pino-debug-happy.png
          if git diff --cached --quiet; then
            echo "Pino GIFs already up to date"
            exit 0
          fi
          git commit -m "chore: build Pino expression GIFs from original eyes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
