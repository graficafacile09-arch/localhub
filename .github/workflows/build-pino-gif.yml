name: Build Pino expression GIFs

on:
  push:
    paths:
      - "public/pino-assistente.jpg"
      - ".github/workflows/build-pino-gif.yml"
  create:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'pino-gif-trigger'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          convert -version
          ffmpeg -version | head -n 1

      - name: Restore and prepare the current Pino artwork
        shell: bash
        run: |
          set -euo pipefail
          cp public/pino-assistente.jpg /tmp/pino-original.jpg
          test -s /tmp/pino-original.jpg
          ffmpeg -y -v warning -i /tmp/pino-original.jpg \
            -vf "scale=560:684:flags=lanczos,unsharp=5:5:0.35:5:5:0" \
            /tmp/pino-source.png
          identify /tmp/pino-source.png

      - name: Build Pino GIFs from the current artwork eyes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pino-frames
          mkdir -p /tmp/pino-frames/searching /tmp/pino-frames/happy /tmp/pino-frames/sad

          LEFT_EYE="56x56+202+308"
          RIGHT_EYE="56x56+302+308"

          make_eye() {
            local src="$1"
            local geometry="$2"
            local scale="$3"
            local angle="$4"
            local out="$5"
            convert "$src" \
              -crop "$geometry" +repage \
              -alpha on -fuzz 14% -fill none -draw "matte 0,0 floodfill" \
              -resize "100%x${scale}%" \
              -background none -gravity center -rotate "$angle" -extent 56x56 \
              "$out"
          }

          make_frame() {
            local src="$1"
            local out="$2"
            local scale="$3"
            local left_angle="$4"
            local right_angle="$5"
            local tmp="$6"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            make_eye "$src" "$LEFT_EYE" "$scale" "$left_angle" "$tmp/left.png"
            make_eye "$src" "$RIGHT_EYE" "$scale" "$right_angle" "$tmp/right.png"
            convert "$src" \
              "$tmp/left.png" -geometry +202+308 -compose over -composite \
              "$tmp/right.png" -geometry +302+308 -compose over -composite \
              "$out"
          }

          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) scale="100" ;;
              1|6) scale="94" ;;
              2|5) scale="88" ;;
              3|4) scale="82" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/searching/frame-$i.png" "$scale" "0" "0" /tmp/pino-eye-searching
          done

          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) scale="100"; angle="0" ;;
              1|6) scale="92"; angle="6" ;;
              2|5) scale="84"; angle="9" ;;
              3|4) scale="74"; angle="13" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/happy/frame-$i.png" "$scale" "-$angle" "$angle" /tmp/pino-eye-happy
          done

          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0|7) scale="100"; angle="0" ;;
              1|6) scale="94"; angle="10" ;;
              2|5) scale="90"; angle="16" ;;
              3|4) scale="88"; angle="20" ;;
            esac
            make_frame /tmp/pino-source.png "/tmp/pino-frames/sad/frame-$i.png" "$scale" "$angle" "-$angle" /tmp/pino-eye-sad
          done

          # Happy keeps the original palette. Sad keeps the natural Pino palette.
          # IMPORTANT: remove the old red marks under the eyes first, then add actual
          # translucent tears. No desaturation and no decorative arrows/lines.
          convert -delay 10 -loop 0 /tmp/pino-frames/searching/frame-*.png -coalesce -layers OptimizeTransparency public/pino-assistente-searching.gif
          convert -delay 10 -loop 0 /tmp/pino-frames/happy/frame-*.png -coalesce -layers OptimizeTransparency public/pino-assistente-happy.gif

          clean_sad_marks() {
            local src="$1"
            local out="$2"
            python3 - "$src" "$out" <<'PY'
          from PIL import Image, ImageFilter
          import sys

          src, out = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert("RGBA")
          blurred = im.filter(ImageFilter.GaussianBlur(radius=2.2))
          px = im.load()
          bp = blurred.load()

          # Only inspect the skin immediately below each eye. Replace genuinely
          # red pixels with the local blurred skin colour, leaving the eyes and
          # the rest of Pino completely untouched.
          zones = [
              (196, 340, 264, 398),
              (296, 340, 364, 398),
          ]
          for x0, y0, x1, y1 in zones:
              for y in range(y0, min(y1, im.height)):
                  for x in range(x0, min(x1, im.width)):
                      r, g, b, a = px[x, y]
                      if r > 120 and r - g >= 22 and r - b >= 22 and r > g * 1.16:
                          px[x, y] = bp[x, y]
          im.save(out, "PNG")
          PY
          }

          add_tears() {
            local src="$1"
            local out="$2"
            local dy="$3"
            convert "$src"               -fill "rgba(111,191,255,0.92)"               -stroke "rgba(62,142,214,0.52)" -strokewidth 1               -draw "path 'M 229,$((354+dy)) C 224,$((361+dy)) 224,$((371+dy)) 229,$((379+dy)) C 234,$((371+dy)) 234,$((361+dy)) 229,$((354+dy)) Z'"               -fill "rgba(245,251,255,0.88)" -stroke none               -draw "ellipse 227,$((360+dy)) 229,$((366+dy))"               -fill "rgba(111,191,255,0.92)"               -stroke "rgba(62,142,214,0.52)" -strokewidth 1               -draw "path 'M 329,$((354+dy)) C 324,$((361+dy)) 324,$((371+dy)) 329,$((379+dy)) C 334,$((371+dy)) 334,$((361+dy)) 329,$((354+dy)) Z'"               -fill "rgba(245,251,255,0.88)" -stroke none               -draw "ellipse 327,$((360+dy)) 329,$((366+dy))"               "$out"
          }

          rm -f /tmp/pino-frames/sad/tear-*.png
          for i in 0 1 2 3 4 5 6 7; do
            case "$i" in
              0) dy="0" ;;
              1) dy="2" ;;
              2) dy="5" ;;
              3) dy="8" ;;
              4) dy="11" ;;
              5) dy="8" ;;
              6) dy="4" ;;
              7) dy="1" ;;
            esac
            clean_sad_marks "/tmp/pino-frames/sad/frame-$i.png" "/tmp/pino-frames/sad/clean-$i.png"
            add_tears "/tmp/pino-frames/sad/clean-$i.png" "/tmp/pino-frames/sad/tear-$i.png" "$dy"
          done

          convert -delay 10 -loop 0 /tmp/pino-frames/sad/tear-*.png -coalesce -layers OptimizeTransparency public/pino-assistente-sad.gif

          identify public/pino-assistente-searching.gif
          identify public/pino-assistente-happy.gif
          identify public/pino-assistente-sad.gif

      - name: Commit Pino GIFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].noreply.github.com"
          git add public/pino-assistente-searching.gif public/pino-assistente-happy.gif public/pino-assistente-sad.gif
          if git diff --cached --quiet; then
            echo "Pino GIFs already up to date"
            exit 0
          fi
          git commit -m "chore: build Pino expression GIFs from original eyes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
