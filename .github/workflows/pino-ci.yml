name: Pino CI

on:
  push:
    branches:
      - main
      - pino/fase-a-conoscenza
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pino-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline Pino tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without submodules
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline Pino verification
        run: npm run verify:ci

      - name: TypeScript
        run: npx tsc --noEmit
